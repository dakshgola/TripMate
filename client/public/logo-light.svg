  <!-- Wordmark Text (Light for Dark Backdrops) -->
  <text x="64" y="38" font-family="Outfit, Inter, system-ui, sans-serif" font-size="26" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Trip <tspan fill="#f97316">Mate</tspan>
