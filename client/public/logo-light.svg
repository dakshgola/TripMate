    <circle cx="24" cy="24" r="17" fill="none" stroke="#5eead4" stroke-width="2" opacity="0.4" />
    <path d="M 24 24 L 24 10 L 32 19 Z" fill="url(#goldNeedle)" />
    <path d="M 24 24 L 24 10 L 19 20 Z" fill="#f59e0b" />
