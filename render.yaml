services:
  - type: web
    name: tripmate
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: tripmate-data
      mountPath: /app/data
      sizeGB: 1
