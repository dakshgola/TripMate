services:
  - type: web
    name: tripmate
    runtime: docker
    plan: free
    region: oregon
    branch: rebrand-tripmate
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
    # NOTE: Render Disks require a paid plan (Starter $7/mo or above).
    # On Render Free Tier, disks cannot be mounted, and data is ephemeral.
    # To enable persistent storage on Render, upgrade the plan to 'starter'
    # and uncomment the disk configuration below:
    # disk:
    #   name: tripmate-data
    #   mountPath: /app/data
    #   sizeGB: 1
